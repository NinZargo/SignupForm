<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        // ── Password recovery interceptor ──────────────────────────────────────
        // Runs synchronously before React / HashRouter initialise.
        // Supabase appends tokens to window.location.hash, e.g.:
        //   /#access_token=...&refresh_token=...&type=recovery
        // HashRouter would overwrite the hash before Supabase can read the tokens,
        // so we extract and stash them in sessionStorage first.
        var hash = window.location.hash;
        if (hash.indexOf('type=recovery') !== -1) {
          // Strip the leading '#'
          var params = new URLSearchParams(hash.substring(1));
          var access_token = params.get('access_token');
          var refresh_token = params.get('refresh_token');
          if (access_token && refresh_token) {
            sessionStorage.setItem('sb_recovery_access_token', access_token);
            sessionStorage.setItem('sb_recovery_refresh_token', refresh_token);
          }
          // Rewrite hash so HashRouter routes to the password-reset page
          window.location.hash = '#/update-password';
        }

        // ── Dev service worker cleanup ─────────────────────────────────────────
        var isLocal = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === '[::1]'
        );
        if ('serviceWorker' in navigator && isLocal) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success) {
                  console.log('Unregistered stale dev ServiceWorker');
                  window.location.reload();
                }
              });
            }
          });
        }
      })();
    </script>
